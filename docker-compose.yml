# Optional Qdrant server for multi-process / production use.
# Embedded local disk (./qdrant_db) is the default and needs no Docker.
#
#   docker compose up -d
#   set QDRANT_URL=http://127.0.0.1:6333
#   python ingest.py --reset
#   streamlit run app.py

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
