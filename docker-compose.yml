# Production Qdrant server (required for hybrid search at runtime).
#
#   docker compose up -d
#   python ingest.py --reset
#   streamlit run app.py
#
# Dashboard: http://127.0.0.1:6333/dashboard
# REST API:  http://127.0.0.1:6333

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: rag-sap-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 8s

volumes:
  qdrant_data:
